# Static site from website/ → GitHub Pages
# Enable once: Settings → Pages → Source = GitHub Actions

name: pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "VERSION"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject product version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          python3 - <<'PY'
          from pathlib import Path
          import re
          version = Path("VERSION").read_text(encoding="utf-8").strip()
          n = 0
          for path in Path("website").rglob("*.html"):
              html = path.read_text(encoding="utf-8")
              next_html, count_attr = re.subn(
                  r'(<span data-aos-version=")[^"]*(">)[^<]*(</span>)',
                  rf'\g<1>{version}\g<2>{version}\g<3>',
                  html,
              )
              next_html, count_legacy = re.subn(
                  r"(<span data-aos-version>)[^<]*(</span>)",
                  rf'<span data-aos-version="{version}">{version}\g<2>',
                  next_html,
              )
              count = count_attr + count_legacy
              if count:
                  path.write_text(next_html, encoding="utf-8")
                  n += count
          print(f"injected version {version} into {n} spans")
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v4
