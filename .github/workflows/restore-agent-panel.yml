name: restore-agent-panel
on:
  workflow_dispatch:
  push:
    branches: [cursor/illustration-rebase-d3ea]
    paths:
      - ".github/workflows/restore-agent-panel.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/illustration-rebase-d3ea
      - name: Restore agent_panel.rs from verified download
        env:
          FILE_URL: "https://litter.catbox.moe/591jsw.rs"
          FILE_SHA256: "5f50e104390c3706f29eee0a80d0e512ef2883b1d98a16314194b76983487f67"
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, os, urllib.request
          from pathlib import Path
          url = os.environ["FILE_URL"]
          expect = os.environ["FILE_SHA256"]
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          data = urllib.request.urlopen(req, timeout=120).read()
          got = hashlib.sha256(data).hexdigest()
          if got != expect:
              raise SystemExit(f"sha mismatch {got} != {expect}")
          if not data.startswith(b"//! Panneau"):
              raise SystemExit(f"bad prefix {data[:40]!r}")
          path = Path("crates/aos-ui-egui/src/agent_panel.rs")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(data)
          print("restored", path, len(data), got)
          PY
          rm -f .github/workflows/restore-agent-panel.yml
          git config user.name "azerothl"
          git config user.email "loic.peaudecerf@gmail.com"
          git add crates/aos-ui-egui/src/agent_panel.rs
          git add -u .github/workflows/restore-agent-panel.yml || true
          git status --short
          git commit -m "fix(ui): restore agent_panel.rs content after bad MCP push"
          git push origin HEAD:cursor/illustration-rebase-d3ea
