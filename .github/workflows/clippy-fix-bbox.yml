name: clippy-fix-bbox
on:
  push:
    paths:
      - ".clippy-fix-staging/TRIGGER"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/dev-assistant-git-status-diff-0ba7
          fetch-depth: 0
      - name: Apply clippy needless-borrow fix
        run: |
          set -euo pipefail
          python3 .clippy-fix-staging/apply_patch.py
          rm -rf .clippy-fix-staging .github/workflows/clippy-fix-bbox.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --stat
          git commit -m "fix(clippy): drop needless borrow on bbox and_then (aos-proto)"
          git push origin HEAD:cursor/dev-assistant-git-status-diff-0ba7
