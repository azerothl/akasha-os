name: workspace-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: workspace-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  GGML_NATIVE: "OFF"

jobs:
  hygiene:
    name: Release consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check release version consistency
        shell: pwsh
        run: ./packaging/check-version.ps1
      - name: Reject UI crate glob imports
        shell: bash
        run: |
          if rg -n -g '*.rs' 'use crate::\*' crates/aos-ui-egui/src; then
            echo 'UI modules must declare their crate dependencies explicitly.' >&2
            exit 1
          fi

  rust:
    name: Clippy and tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-ci-linux
      - name: Clippy core and primary UI (warnings are errors)
        run: cargo clippy -p aos-proto -p aos-agent -p aos-ui-egui --all-targets -- -D warnings
      # The release workflow owns CUDA builds. Keep the general CI job CPU-only
      # so pull requests do not require a CUDA toolkit or compile llama.cpp twice.
      - name: Clippy workspace (CPU)
        run: cargo clippy --workspace --all-targets --exclude aos-llama --exclude aos-model --exclude aos-platform
      - name: Clippy model stack (CPU)
        run: |
          cargo clippy -p aos-llama --no-default-features --all-targets
          cargo clippy -p aos-model --no-default-features --all-targets
          cargo clippy -p aos-platform --no-default-features --all-targets
      - name: Test workspace (CPU)
        run: cargo test --workspace --exclude aos-llama --exclude aos-model --exclude aos-platform
      - name: Test model stack (CPU)
        run: |
          cargo test -p aos-llama --no-default-features
          cargo test -p aos-model --no-default-features
          cargo test -p aos-platform --no-default-features
