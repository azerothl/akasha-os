# Build & publish Akasha OS Preview (Windows + Linux CUDA, no GGUF in zip)

name: preview-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create/upload GitHub Release assets"
        type: boolean
        default: false

concurrency:
  group: preview-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "4"
  # Limit ggml CUDA SMs (default builds many arches → ~1h+). Turing→Ada consumer GPUs.
  # Forwarded by llama-cpp-sys-2 build.rs to CMake.
  CMAKE_CUDA_ARCHITECTURES: "75;80;86;89"
  # Shared by cargo + cmake-rs / ninja
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  # Avoid native host tuning in CI (no GPU / unstable ISA assumptions).
  GGML_NATIVE: "OFF"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: preview-cuda-windows
          cache-targets: true
          cache-all-crates: true

      - name: Install Ninja
        shell: pwsh
        run: |
          $ver = "1.12.1"
          $zip = "$env:RUNNER_TEMP\ninja.zip"
          Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/download/v$ver/ninja-win.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\ninja" -Force
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\ninja"
          ninja --version

      # Skip cupti (profiling only). Keep visual_studio_integration for nvcc+MSVC.
      - name: Install CUDA Toolkit 12.4
        uses: Jimver/cuda-toolkit@v0.2.23
        with:
          cuda: "12.4.1"
          method: network
          use-github-cache: false
          use-local-cache: false
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","nvrtc","nvrtc_dev","thrust","visual_studio_integration"]'

      - name: Build Preview package
        shell: pwsh
        # Do not force CMAKE_GENERATOR=Ninja on Windows: CUDA+MSVC needs VS env;
        # cmake-rs defaults to the VS generator which is reliable on GHA.
        env:
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
          CMAKE_CUDA_COMPILER_LAUNCHER: sccache
        run: |
          sccache --show-stats
          $ver = (Get-Content VERSION -Raw).Trim()
          .\packaging\build-preview.ps1 -SkipModels -RequireCuda -Version $ver
          $dir = "dist\AgentOS-Preview-$ver-windows-x64"
          if (-not (Test-Path "$dir\bin\aos-session.exe")) { throw "missing aos-session" }
          if (-not (Test-Path "$dir\share\models\manifest.json")) { throw "missing manifest" }
          $dll = Get-ChildItem "$dir\bin" -Filter "cudart64_*.dll"
          if (-not $dll) { throw "missing CUDA cudart DLL" }
          Compress-Archive -Path "$dir\*" -DestinationPath "dist\AgentOS-Preview-$ver-windows-x64.zip" -Force
          sccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: preview-windows-x64
          path: dist/AgentOS-Preview-*-windows-x64.zip
          compression-level: 0
          retention-days: 7

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    container:
      image: nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq \
            build-essential pkg-config curl ca-certificates git cmake ninja-build \
            findutils zstd clang libclang-dev libssl-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libasound2-dev xz-utils lld

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: preview-cuda-linux
          cache-targets: true
          cache-all-crates: true

      - name: Build Preview package
        env:
          CUDA_HOME: /usr/local/cuda
          SKIP_MODELS: "1"
          REQUIRE_CUDA: "1"
          CMAKE_GENERATOR: Ninja
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
          CMAKE_CUDA_COMPILER_LAUNCHER: sccache
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
        run: |
          sccache --show-stats
          VERSION="$(tr -d '[:space:]' < VERSION)"
          export VERSION
          export LIBCLANG_PATH="$(dirname "$(ls -1 /usr/lib/llvm-*/lib/libclang.so* 2>/dev/null | head -n1)")"
          chmod +x packaging/build-preview.sh
          bash packaging/build-preview.sh
          OUT="dist/AgentOS-Preview-${VERSION}-linux-x64"
          test -x "${OUT}/bin/aos-session"
          test -f "${OUT}/share/models/manifest.json"
          ls "${OUT}/bin"/libcudart.so* >/dev/null
          echo "== bin layout =="
          ls -lah "${OUT}/bin" | head -n 80
          du -sh "${OUT}" "${OUT}/bin"
          tar -C dist -czf "dist/AgentOS-Preview-${VERSION}-linux-x64.tar.gz" "AgentOS-Preview-${VERSION}-linux-x64"
          ls -lh "dist/AgentOS-Preview-${VERSION}-linux-x64.tar.gz"
          sccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: preview-linux-x64
          path: dist/AgentOS-Preview-*-linux-x64.tar.gz
          compression-level: 0
          retention-days: 7

  release:
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare assets + latest.json
        id: prep
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          mkdir -p release-assets
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release-assets/ \;
          ls -lah release-assets

          # GitHub Release assets must be < 2 GiB each.
          max=$((2 * 1024 * 1024 * 1024 - 1))
          for f in release-assets/*; do
            [ -f "$f" ] || continue
            size=$(stat -c%s "$f")
            echo "$f: $size bytes"
            if [ "$size" -ge "$max" ]; then
              echo "::error::$f exceeds GitHub Release asset limit (2 GiB)"
              exit 1
            fi
          done

          WIN=$(ls release-assets/*windows*.zip | head -n1)
          LIN=$(ls release-assets/*linux*.tar.gz | head -n1)
          WIN_SHA=$(sha256sum "$WIN" | awk '{print $1}')
          LIN_SHA=$(sha256sum "$LIN" | awk '{print $1}')
          cat > release-assets/latest.json <<EOF
          {
            "version": "${VERSION}",
            "tag": "v${VERSION}",
            "repo": "azerothl/akasha-os",
            "assets": [
              {
                "name": "$(basename "$WIN")",
                "os": "windows",
                "sha256": "${WIN_SHA}"
              },
              {
                "name": "$(basename "$LIN")",
                "os": "linux",
                "sha256": "${LIN_SHA}"
              }
            ],
            "notes": "Akasha OS Preview ${VERSION} — NVIDIA Win/Linux. Models download on first run. See FIRST-RUN.md."
          }
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prep.outputs.version }}
          name: Akasha OS Preview ${{ steps.prep.outputs.version }}
          generate_release_notes: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
