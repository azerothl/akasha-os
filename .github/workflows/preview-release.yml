# Build & publish Akasha OS Preview (Windows + Linux CUDA, no GGUF in zip)

name: preview-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      macos_only:
        description: "macOS Apple Silicon only — build zip and attach to an existing Release (skip Win/Linux)"
        type: boolean
        default: true
      release_version:
        description: "Release version to attach (e.g. 0.13.0). Empty = VERSION file in checkout."
        type: string
        default: "0.13.0"
      upload_release:
        description: "Upload macOS zip + refresh latest.json on the GitHub Release"
        type: boolean
        default: true
      create_release:
        description: "Full Win/Linux/macOS build and publish a new Release (tag push alternative)"
        type: boolean
        default: false

concurrency:
  group: preview-release-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.macos_only && 'macos-only' || 'full' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "4"
  # Limit ggml CUDA SMs. Each arch is statically linked into modeld/platformd;
  # 4 real arches blew past the GitHub 2 GiB release limit on Windows.
  # RTX 30/40 SASS + Turing PTX for older cards.
  CMAKE_CUDA_ARCHITECTURES: "75-virtual;86;89"
  # Shared by cargo + cmake-rs / ninja
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  # Avoid native host tuning in CI (no GPU / unstable ISA assumptions).
  GGML_NATIVE: "OFF"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

permissions:
  contents: read

jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || !inputs.macos_only
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: preview-cuda-windows
          cache-targets: true
          cache-all-crates: true

      - name: Install Ninja
        shell: pwsh
        run: |
          $ver = "1.12.1"
          $zip = "$env:RUNNER_TEMP\ninja.zip"
          Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/download/v$ver/ninja-win.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\ninja" -Force
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\ninja"
          ninja --version

      # Skip cupti (profiling only). Keep visual_studio_integration for nvcc+MSVC.
      - name: Install CUDA Toolkit 12.4
        uses: Jimver/cuda-toolkit@v0.2.23
        with:
          cuda: "12.4.1"
          method: network
          use-github-cache: false
          use-local-cache: false
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","nvrtc","nvrtc_dev","thrust","visual_studio_integration"]'

      - name: Assert VERSION matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -Raw).Trim()
          $expected = $env:GITHUB_REF_NAME.Substring(1)
          if ($ver -ne $expected) {
            throw "VERSION file is '$ver' but tag is '$($env:GITHUB_REF_NAME)'. Update VERSION before tagging."
          }

      - name: Build Preview package
        shell: pwsh
        # Do not force CMAKE_GENERATOR=Ninja on Windows: CUDA+MSVC needs VS env;
        # cmake-rs defaults to the VS generator which is reliable on GHA.
        env:
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
          CMAKE_CUDA_COMPILER_LAUNCHER: sccache
        run: |
          sccache --show-stats
          $ver = (Get-Content VERSION -Raw).Trim()
          .\packaging\build-preview.ps1 -SkipModels -RequireCuda -Version $ver
          $dir = "dist\AgentOS-Preview-$ver-windows-x64"
          if (-not (Test-Path "$dir\bin\aos-session.exe")) { throw "missing aos-session" }
          if (-not (Test-Path "$dir\share\models\manifest.json")) { throw "missing manifest" }
          if (-not (Test-Path "$dir\share\modules\catalogue.yaml")) { throw "missing catalogue.yaml" }
          if (-not (Test-Path "$dir\share\modules\catalogue.yaml.sig")) { throw "missing catalogue.yaml.sig" }
          if (-not (Test-Path "$dir\share\modules\catalogue.pub")) { throw "missing catalogue.pub" }
          $dll = Get-ChildItem "$dir\bin" -Filter "cudart64_*.dll"
          if (-not $dll) { throw "missing CUDA cudart DLL" }
          if (-not (Test-Path "$dir\bin\aos-modeld-cpu.exe")) { throw "missing aos-modeld-cpu" }
          Compress-Archive -Path "$dir\*" -DestinationPath "dist\AgentOS-Preview-$ver-windows-x64.zip" -Force
          sccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: preview-windows-x64
          path: dist/AgentOS-Preview-*-windows-x64.zip
          compression-level: 0
          retention-days: 7

  linux:
    if: github.event_name != 'workflow_dispatch' || !inputs.macos_only
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    container:
      image: nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq \
            build-essential pkg-config curl ca-certificates git cmake ninja-build \
            findutils zstd clang libclang-dev libssl-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libasound2-dev xz-utils lld

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: preview-cuda-linux
          cache-targets: true
          cache-all-crates: true

      - name: Assert VERSION matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          EXPECTED="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$EXPECTED" ]; then
            echo "::error::VERSION file is '$VERSION' but tag is '$GITHUB_REF_NAME'. Update VERSION before tagging."
            exit 1
          fi

      - name: Build Preview package
        env:
          CUDA_HOME: /usr/local/cuda
          SKIP_MODELS: "1"
          REQUIRE_CUDA: "1"
          CMAKE_GENERATOR: Ninja
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
          CMAKE_CUDA_COMPILER_LAUNCHER: sccache
          # Host only — must not leak to wasm32 (rust-lld rejects -fuse-ld=lld).
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
        run: |
          sccache --show-stats
          VERSION="$(tr -d '[:space:]' < VERSION)"
          export VERSION
          export LIBCLANG_PATH="$(dirname "$(ls -1 /usr/lib/llvm-*/lib/libclang.so* 2>/dev/null | head -n1)")"
          chmod +x packaging/build-preview.sh
          bash packaging/build-preview.sh
          OUT="dist/AgentOS-Preview-${VERSION}-linux-x64"
          test -x "${OUT}/bin/aos-session"
          test -x "${OUT}/bin/aos-modeld-cpu"
          test -f "${OUT}/share/models/manifest.json"
          test -f "${OUT}/share/modules/catalogue.yaml"
          test -f "${OUT}/share/modules/catalogue.yaml.sig"
          test -f "${OUT}/share/modules/catalogue.pub"
          ls "${OUT}/bin"/libcudart.so* >/dev/null
          echo "== bin layout =="
          ls -lah "${OUT}/bin" | head -n 80
          du -sh "${OUT}" "${OUT}/bin"
          tar -C dist -czf "dist/AgentOS-Preview-${VERSION}-linux-x64.tar.gz" "AgentOS-Preview-${VERSION}-linux-x64"
          ls -lh "dist/AgentOS-Preview-${VERSION}-linux-x64.tar.gz"
          sccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: preview-linux-x64
          path: dist/AgentOS-Preview-*-linux-x64.tar.gz
          compression-level: 0
          retention-days: 7

  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.macos_only || inputs.create_release
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release VERSION
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_version }}" ]; then
            VERSION="${{ inputs.release_version }}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: preview-metal-macos
          cache-targets: true
          cache-all-crates: true

      - name: Assert VERSION matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          EXPECTED="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$EXPECTED" ]; then
            echo "::error::VERSION file is '$VERSION' but tag is '$GITHUB_REF_NAME'. Update VERSION before tagging."
            exit 1
          fi

      - name: Assert Apple Silicon runner
        run: |
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::macos job must run on Apple Silicon (arm64)"
            exit 1
          fi

      - name: Build Preview package (Metal)
        env:
          SKIP_MODELS: "1"
          RUSTC_WRAPPER: sccache
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          sccache --show-stats
          export VERSION
          chmod +x packaging/build-preview-macos.sh
          ./packaging/build-preview-macos.sh
          OUT="dist/AgentOS-Preview-${VERSION}-macos-arm64"
          test -x "${OUT}/bin/aos-session"
          test -x "${OUT}/bin/aos-modeld-cpu"
          test -f "${OUT}/share/models/manifest.json"
          test -f "${OUT}/share/modules/catalogue.yaml"
          test -f "${OUT}/share/modules/catalogue.yaml.sig"
          test -f "${OUT}/share/modules/catalogue.pub"
          du -sh "${OUT}"
          # Mac Preview is slim without bundled GGUF or CUDA DLLs; verify real binaries.
          test -x "${OUT}/bin/aos-modeld"
          test -x "${OUT}/bin/aos-ui-egui"
          test -d "${OUT}/share/modules/canvas.aospkg"
          modeld_bytes=$(stat -f%z "${OUT}/bin/aos-modeld")
          platformd_bytes=$(stat -f%z "${OUT}/bin/aos-platformd")
          if [ "${modeld_bytes}" -lt 5000000 ]; then
            echo "::error::aos-modeld too small (${modeld_bytes} bytes) — likely missing llama/Metal"
            exit 1
          fi
          if [ "${platformd_bytes}" -lt 5000000 ]; then
            echo "::error::aos-platformd too small (${platformd_bytes} bytes) — likely missing embeddings"
            exit 1
          fi
          if ! strings "${OUT}/bin/aos-modeld" | grep -qiE 'Metal\.framework|ggml.*metal'; then
            echo "::error::aos-modeld missing Metal backend linkage (Metal.framework / ggml metal)"
            exit 1
          fi
          ZIP="dist/AgentOS-Preview-${VERSION}-macos-arm64.zip"
          if [ ! -f "${ZIP}" ]; then
            echo "::error::missing ${ZIP} (build-preview-macos.sh should create it)"
            exit 1
          fi
          ls -lh "${ZIP}"
          sccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: preview-macos-arm64
          path: dist/AgentOS-Preview-*-macos-arm64.zip
          compression-level: 0
          retention-days: 7

  release-macos-only:
    needs: [macos]
    runs-on: ubuntu-22.04
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.macos_only &&
      inputs.upload_release &&
      needs.macos.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: preview-macos-arm64
          path: artifacts

      - name: Prepare macOS asset + merge latest.json
        id: prep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.release_version }}" ]; then
            VERSION="${{ inputs.release_version }}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          mkdir -p release-assets existing-release
          MAC_ZIP="$(find artifacts -type f -name '*macos-arm64.zip' | head -n1)"
          if [ -z "${MAC_ZIP}" ] || [ ! -f "${MAC_ZIP}" ]; then
            echo "::error::macOS zip artifact not found"
            exit 1
          fi
          cp -f "${MAC_ZIP}" "release-assets/$(basename "${MAC_ZIP}")"
          MAC_NAME="$(basename "${MAC_ZIP}")"
          MAC_SHA="$(sha256sum "release-assets/${MAC_NAME}" | awk '{print $1}')"

          max=$((2 * 1024 * 1024 * 1024 - 1))
          size=$(stat -c%s "release-assets/${MAC_NAME}")
          if [ "$size" -ge "$max" ]; then
            echo "::error::${MAC_NAME} exceeds GitHub Release 2 GiB asset limit"
            exit 1
          fi

          if ! gh release view "${TAG}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} not found — create it first or check release_version"
            exit 1
          fi

          gh release download "${TAG}" -R "${GITHUB_REPOSITORY}" -p 'latest.json' -D existing-release 2>/dev/null || true

          if [ -f existing-release/latest.json ]; then
            jq --arg name "${MAC_NAME}" --arg sha "${MAC_SHA}" \
              '.assets = ((.assets // []) | map(select(.os != "macos")) + [{"name":$name,"os":"macos","sha256":$sha}])' \
              existing-release/latest.json > release-assets/latest.json
          else
            cat > release-assets/latest.json <<EOF
          {
            "version": "${VERSION}",
            "tag": "${TAG}",
            "repo": "${GITHUB_REPOSITORY}",
            "assets": [{"name":"${MAC_NAME}","os":"macos","sha256":"${MAC_SHA}"}],
            "notes": "Akasha OS Preview ${VERSION} — macOS Apple Silicon (Metal + CPU modeld). Models download on first run. See FIRST-RUN.md."
          }
          EOF
          fi

          echo "== upload assets =="
          ls -lah release-assets

      - name: Upload to existing GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          generate_release_notes: false
          make_latest: false
          overwrite_files: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-22.04
    if: >-
      (startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && inputs.create_release && !inputs.macos_only)) &&
      needs.windows.result == 'success' &&
      needs.linux.result == 'success' &&
      needs.macos.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare assets + latest.json
        id: prep
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            EXPECTED="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$EXPECTED" ]; then
              echo "::error::VERSION file is '$VERSION' but tag is '$GITHUB_REF_NAME'. Update VERSION before tagging."
              exit 1
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          mkdir -p release-assets
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release-assets/ \;
          ls -lah release-assets

          # GitHub Release assets must be < 2 GiB each.
          max=$((2 * 1024 * 1024 * 1024 - 1))
          for f in release-assets/*; do
            [ -f "$f" ] || continue
            size=$(stat -c%s "$f")
            echo "$f: $size bytes"
            if [ "$size" -ge "$max" ]; then
              echo "::error::$f exceeds GitHub Release asset limit (2 GiB)"
              exit 1
            fi
          done

          # One tester artefact per OS (CUDA + CPU modeld inside).
          assets_json="["
          first=1
          for f in release-assets/*windows-x64.zip release-assets/*linux-x64.tar.gz release-assets/*macos-arm64.zip; do
            [ -f "$f" ] || continue
            sha=$(sha256sum "$f" | awk '{print $1}')
            base=$(basename "$f")
            os="windows"
            if echo "$base" | grep -q linux; then os="linux"; fi
            if echo "$base" | grep -q macos; then os="macos"; fi
            if [ "$first" -eq 1 ]; then first=0; else assets_json+=","; fi
            assets_json+=$(printf '{"name":"%s","os":"%s","sha256":"%s"}' "$base" "$os" "$sha")
          done
          assets_json+="]"
          # Fallback if naming differs: pick any win/linux pair.
          if [ "$assets_json" = "[]" ]; then
            WIN=$(ls release-assets/*windows*.zip 2>/dev/null | head -n1 || true)
            LIN=$(ls release-assets/*linux*.tar.gz 2>/dev/null | head -n1 || true)
            MAC=$(ls release-assets/*macos*.zip 2>/dev/null | head -n1 || true)
            assets_json="["
            first=1
            for f in $WIN $LIN $MAC; do
              [ -n "$f" ] && [ -f "$f" ] || continue
              sha=$(sha256sum "$f" | awk '{print $1}')
              base=$(basename "$f")
              os="windows"; echo "$base" | grep -q linux && os="linux"; echo "$base" | grep -q macos && os="macos"
              if [ "$first" -eq 1 ]; then first=0; else assets_json+=","; fi
              assets_json+=$(printf '{"name":"%s","os":"%s","sha256":"%s"}' "$base" "$os" "$sha")
            done
            assets_json+="]"
          fi
          cat > release-assets/latest.json <<EOF
          {
            "version": "${VERSION}",
            "tag": "v${VERSION}",
            "repo": "azerothl/akasha-os",
            "assets": ${assets_json},
            "notes": "Akasha OS Preview ${VERSION} — Win/Linux (CUDA + CPU modeld) + macOS Apple Silicon (Metal + CPU modeld). Models download on first run. See FIRST-RUN.md."
          }
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prep.outputs.version }}
          name: Akasha OS Preview ${{ steps.prep.outputs.version }}
          generate_release_notes: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
