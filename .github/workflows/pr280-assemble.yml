name: pr280-assemble
on:
  workflow_dispatch:
  push:
    branches: [cursor/illustration-rebase-d3ea]
    paths:
      - ".github/workflows/pr280-assemble.yml"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/illustration-rebase-d3ea
          fetch-depth: 0
      - name: Download and apply remaining files
        env:
          TARBALL_URL: "https://litter.catbox.moe/k89ikq.gz"
          TARBALL_SHA256: "94a93e26bc9c3487ef89031fea75df5472d852a4c7a8e6065cf61037735a18ef"
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, os, tarfile, io, urllib.request
          url = os.environ["TARBALL_URL"]
          expect = os.environ["TARBALL_SHA256"]
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          data = urllib.request.urlopen(req, timeout=180).read()
          got = hashlib.sha256(data).hexdigest()
          if got != expect:
              raise SystemExit(f"sha mismatch {got} != {expect} size={len(data)} head={data[:40]!r}")
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as tf:
              tf.extractall(".")
          print("extracted", len(data), "bytes")
          PY
          rm -rf .pr280-staging || true
          rm -f benchmarks/illustration/.pr280-canary benchmarks/illustration/.pr280-push-progress || true
          rm -f .github/workflows/pr280-assemble.yml
          git config user.name "azerothl"
          git config user.email "loic.peaudecerf@gmail.com"
          git add -A
          git status --short | head -100
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "feat(illust): rebase surface assemble remaining files from staging tarball"
          git push origin HEAD:cursor/illustration-rebase-d3ea
