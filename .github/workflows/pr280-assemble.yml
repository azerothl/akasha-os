name: pr280-assemble
on:
  workflow_dispatch:
  push:
    branches: [cursor/illustration-rebase-d3ea]
    paths:
      - ".github/workflows/pr280-assemble.yml"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/illustration-rebase-d3ea
          fetch-depth: 0
      - name: Download and apply remaining files
        env:
          TARBALL_PAGE: "https://tmpfiles.org/wUAyA1lwbwMq/pr280-rest.tar.gz"
          TARBALL_SHA256: "94a93e26bc9c3487ef89031fea75df5472d852a4c7a8e6065cf61037735a18ef"
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, os, re, subprocess, sys, tarfile, urllib.request
          page_url = os.environ["TARBALL_PAGE"]
          expect = os.environ["TARBALL_SHA256"]
          html = urllib.request.urlopen(page_url, timeout=60).read().decode("utf-8", "replace")
          m = re.search(r'href="(https://tmpfiles.org/dl/[^"]+)"', html)
          if not m:
              raise SystemExit("no dl link in tmpfiles page")
          dl = m.group(1)
          print("Downloading", dl)
          data = urllib.request.urlopen(dl, timeout=120).read()
          got = hashlib.sha256(data).hexdigest()
          if got != expect:
              raise SystemExit(f"sha mismatch {got} != {expect}")
          open("/tmp/pr280-rest.tar.gz", "wb").write(data)
          with tarfile.open("/tmp/pr280-rest.tar.gz", "r:gz") as tf:
              tf.extractall(".")
          print("extracted ok")
          PY
          rm -f benchmarks/illustration/.pr280-canary benchmarks/illustration/.pr280-push-progress || true
          rm -f .github/workflows/pr280-assemble.yml
          git config user.name "azerothl"
          git config user.email "loic.peaudecerf@gmail.com"
          git add -A
          git status --short | head -100
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "feat(illust): rebase surface assemble remaining files from staging tarball"
          git push origin HEAD:cursor/illustration-rebase-d3ea
