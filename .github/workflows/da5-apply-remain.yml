name: da5-apply-remain
on:
  push:
    paths:
      - ".da5-staging/TRIGGER"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/dev-assistant-git-status-diff-0ba7
          fetch-depth: 0
      - name: Apply DA.5 surgical patches
        run: |
          set -euo pipefail
          python3 .da5-staging/apply_patch.py
          rm -rf .da5-staging .github/workflows/da5-apply-remain.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat(da5): FEATURES EN/FR + subsystem git.status/diff arms"
          git push origin HEAD:cursor/dev-assistant-git-status-diff-0ba7
