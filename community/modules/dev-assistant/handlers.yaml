# Reference Dev Assistant handlers (DA.4 / #247).
# Packaged via module.package → handlers.json for ext-rt.
# Final step result is returned to the host (no stringifying return maps).
tools:
  dev-assistant.bind:
    steps:
      - service: workspace.bind
        args:
          host_path: "{{args.host_path}}"
  dev-assistant.list:
    steps:
      - service: workspace.list
        args: {}
  dev-assistant.search:
    steps:
      - service: fs.search
        args:
          root: "{{args.root}}"
          query: "{{args.query}}"
          glob: "{{args.glob}}"
          limit: "{{args.limit}}"
  dev-assistant.apply_patch:
    steps:
      - service: fs.apply_patch
        args:
          hunks:
            - path: "{{args.path}}"
              diff: "{{args.content}}"
              replace_all: true
  dev-assistant.undo_patch:
    steps:
      - service: fs.undo_patch
        args:
          undo_group_id: "{{args.undo_group_id}}"
  dev-assistant.git_status:
    steps:
      - service: git.status
        args:
          root: "{{args.root}}"
  dev-assistant.git_diff:
    steps:
      - service: git.diff
        args:
          root: "{{args.root}}"
          path: "{{args.path}}"
          staged: "{{args.staged}}"


  dev-assistant.run:
    steps:
      - service: process.run
        args:
          root: "{{args.root}}"
          task: "{{args.task}}"
  dev-assistant.git_commit:
    steps:
      - service: git.commit
        args:
          root: "{{args.root}}"
          message: "{{args.message}}"

  dev-assistant.studio_project:
    steps:
      - service: studio.project
        args:
          root: "{{args.root}}"
  dev-assistant.studio_reindex:
    steps:
      - service: studio.reindex
        args:
          root: "{{args.root}}"
  dev-assistant.studio_lsp:
    steps:
      - service: studio.lsp
        args:
          root: {$arg: root}
          action: {$arg: action}
          path: {$arg: path}
          text: {$arg: text}
          position: {$arg: position}

  dev-assistant.studio_memory:
    steps:
    - service: studio.memory
      args:
        root:
          $arg: root

  dev-assistant.studio_memory_update:
    steps:
    - service: studio.memory.update
      args:
        root:
          $arg: root
        field:
          $arg: field
        text:
          $arg: text

  dev-assistant.debug_start:
    steps:
    - service: debug.start
      args:
        root:
          $arg: root
        configuration:
          $arg: configuration

  dev-assistant.debug_request:
    steps:
    - service: debug.request
      args:
        root:
          $arg: root
        session_id:
          $arg: session_id
        command:
          $arg: command
        thread_id:
          $arg: thread_id
        frame_id:
          $arg: frame_id
        variables_reference:
          $arg: variables_reference
        path:
          $arg: path
        lines:
          $arg: lines

  dev-assistant.debug_stop:
    steps:
    - service: debug.stop
      args:
        root:
          $arg: root
        session_id:
          $arg: session_id

  dev-assistant.refactor_create:
    steps:
    - service: refactor.create
      args:
        root:
          $arg: root
        assignments:
          $arg: assignments

  dev-assistant.refactor_submit:
    steps:
    - service: refactor.submit
      args:
        root:
          $arg: root
        plan_id:
          $arg: plan_id
        part_id:
          $arg: part_id
        changes:
          $arg: changes

  dev-assistant.refactor_review:
    steps:
    - service: refactor.review
      args:
        root:
          $arg: root
        plan_id:
          $arg: plan_id

  dev-assistant.refactor_apply:
    steps:
    - service: refactor.apply
      args:
        root:
          $arg: root
        plan_id:
          $arg: plan_id
        review_sha256:
          $arg: review_sha256

  dev-assistant.refactor_undo:
    steps:
    - service: refactor.undo
      args:
        root:
          $arg: root
        plan_id:
          $arg: plan_id
        review_sha256:
          $arg: review_sha256
