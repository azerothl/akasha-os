# Reference Dev Assistant handlers (DA.4 / #247).
# Packaged via module.package → handlers.json for ext-rt.
# Final step result is returned to the host (no stringifying return maps).
tools:
  dev-assistant.bind:
    steps:
      - service: workspace.bind
        args:
          host_path: "{{args.host_path}}"
  dev-assistant.list:
    steps:
      - service: workspace.list
        args: {}
  dev-assistant.search:
    steps:
      - service: fs.search
        args:
          root: "{{args.root}}"
          query: "{{args.query}}"
          glob: "{{args.glob}}"
          limit: "{{args.limit}}"
  dev-assistant.apply_patch:
    steps:
      - service: fs.apply_patch
        args:
          hunks:
            - path: "{{args.path}}"
              diff: "{{args.content}}"
              replace_all: true
  dev-assistant.undo_patch:
    steps:
      - service: fs.undo_patch
        args:
          undo_group_id: "{{args.undo_group_id}}"
  dev-assistant.git_status:
    steps:
      - service: git.status
        args:
          root: "{{args.root}}"
  dev-assistant.git_diff:
    steps:
      - service: git.diff
        args:
          root: "{{args.root}}"
          path: "{{args.path}}"
          staged: "{{args.staged}}"


  dev-assistant.run:
    steps:
      - service: process.run
        args:
          root: "{{args.root}}"
          task: "{{args.task}}"
  dev-assistant.git_commit:
    steps:
      - service: git.commit
        args:
          root: "{{args.root}}"
          message: "{{args.message}}"

  dev-assistant.studio_project:
    steps:
      - service: studio.project
        args:
          root: "{{args.root}}"
  dev-assistant.studio_reindex:
    steps:
      - service: studio.reindex
        args:
          root: "{{args.root}}"
  dev-assistant.studio_lsp:
    steps:
      - service: studio.lsp
        args:
          root: "{{args.root}}"
          action: "{{args.action}}"
          path: "{{args.path}}"
          text: "{{args.text}}"
          position: "{{args.position}}"
