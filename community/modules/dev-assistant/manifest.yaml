name: dev-assistant
version: 0.5.0
hash: "ci"
permissions:
  # Bind first. Declare chosen /host/<id>/** caps in the local source manifest,
  # then repackage/update with explicit cap review. No ambient host grants.
  required_caps: []
tools:
  - name: dev-assistant.bind
    description: Bind an absolute host folder as /host/<id> (returns caps to review)
    input_schema:
      type: object
      properties:
        host_path: { type: string, description: Absolute host directory }
      required: [host_path]
  - name: dev-assistant.list
    description: List bound host workspaces for this actor
    input_schema:
      type: object
  - name: dev-assistant.search
    description: Bounded text search under a bound workspace (requires fs.read:/host/<id>/**)
    input_schema:
      type: object
      properties:
        root: { type: string, description: workspace_id or /host/<id> path }
        query: { type: string }
        glob: { type: string }
        limit: { type: integer }
      required: [root, query]
  - name: dev-assistant.apply_patch
    description: Replace file contents under /host/<id> (requires fs.write; prefer over fs.write)
    input_schema:
      type: object
      properties:
        path: { type: string, description: Logical /host/<id>/… path }
        content: { type: string, description: Full replacement body (replace_all) }
      required: [path, content]
  - name: dev-assistant.undo_patch
    description: Undo a previous apply_patch group
    input_schema:
      type: object
      properties:
        undo_group_id: { type: string }
      required: [undo_group_id]
  - name: dev-assistant.git_status
    description: Read-only git status for a bound workspace (requires fs.read:/host/<id>/**)
    input_schema:
      type: object
      properties:
        root: { type: string, description: workspace_id or /host/<id> path }
      required: [root]
  - name: dev-assistant.git_diff
    description: Read-only unified git diff (worktree or staged) under a bound workspace
    input_schema:
      type: object
      properties:
        root: { type: string, description: workspace_id or /host/<id> path }
        path: { type: string, description: optional /host/<id>/… or repo-relative path }
        staged: { type: boolean, description: when true, show staged (--cached) diff }
      required: [root]
  - name: dev-assistant.run
    description: Run a fixed allowlisted workspace task after explicit capabilities and host confirmation
    input_schema:
      type: object
      properties:
        root: { type: string }
        task: { type: string }
      required: [root, task]
  - name: dev-assistant.git_commit
    description: Commit staged changes only, after explicit capabilities and host confirmation; no hooks or signing
    input_schema:
      type: object
      properties:
        root: { type: string }
        message: { type: string }
      required: [root, message]
  - name: dev-assistant.studio_project
    description: Inspect the mapped local Code Studio project and its persistent code index
    input_schema:
      type: object
      properties:
        root: { type: string }
      required: [root]
  - name: dev-assistant.studio_reindex
    description: Incrementally refresh the mapped Code Studio index after host confirmation
    input_schema:
      type: object
      properties:
        root: { type: string }
      required: [root]
  - name: dev-assistant.studio_lsp
    description: Query diagnostics, definition or references through Code Studio after host confirmation
    input_schema:
      type: object
      properties:
        root: { type: string }
        action: { type: string, enum: [diagnostics, definition, references] }
        path: { type: string }
        text: { type: string }
        position:
          type: object
          properties:
            line: { type: integer, minimum: 0 }
            character: { type: integer, minimum: 0 }
      required: [root, action, path]
  - name: dev-assistant.studio_memory
    description: Read durable project summaries and code index in the mapped project
      namespace
    input_schema:
      type: object
      additionalProperties: false
      properties:
        root: &id001
          type: string
          description: Bound workspace id
      required:
      - root
  - name: dev-assistant.studio_memory_update
    description: Update one project memory field after host confirmation
    input_schema:
      type: object
      additionalProperties: false
      properties:
        root: *id001
        field:
          type: string
          enum:
          - project_summary
          - evolution_summary
          - policy_notes
        text:
          type: string
          maxLength: 8192
      required:
      - root
      - field
      - text
  - name: dev-assistant.debug_start
    description: Start an administrator-configured DAP launch after host confirmation;
      online mode only
    input_schema:
      type: object
      additionalProperties: false
      properties:
        root: *id001
        configuration: &id002
          type: string
      required:
      - root
      - configuration
  - name: dev-assistant.debug_request
    description: Inspect or step the actor-owned debug session; evaluate and attach
      are unavailable
    input_schema:
      type: object
      additionalProperties: false
      properties:
        root: *id001
        session_id: *id002
        command:
          type: string
          enum:
          - threads
          - stackTrace
          - scopes
          - variables
          - continue
          - next
          - stepIn
          - stepOut
          - pause
          - setBreakpoints
          - events
        thread_id:
          type: integer
          minimum: 1
        frame_id:
          type: integer
          minimum: 0
        variables_reference:
          type: integer
          minimum: 1
        path: *id002
        lines:
          type: array
          items:
            type: integer
            minimum: 1
          maxItems: 64
      required:
      - root
      - session_id
      - command
  - name: dev-assistant.debug_stop
    description: Stop the current actor-owned debug session and its supervised process
      group
    input_schema:
      type: object
      additionalProperties: false
      properties:
        root: *id001
        session_id: *id002
      required:
      - root
      - session_id
  - name: dev-assistant.refactor_create
    description: Coordinate 2 to 8 existing distinct agents on disjoint subtrees; does
      not launch inference or grant capabilities
    input_schema:
      type: object
      additionalProperties: false
      properties:
        root: *id001
        assignments:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              part_id: *id002
              actor: *id002
              subtree: *id002
            required:
            - part_id
            - actor
            - subtree
          minItems: 2
          maxItems: 8
      required:
      - root
      - assignments
  - name: dev-assistant.refactor_submit
    description: Assigned agent proposes existing text file changes without writing
      host files
    input_schema:
      type: object
      additionalProperties: false
      properties:
        root: *id001
        plan_id: *id002
        part_id: *id002
        changes:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              path: *id002
              base_sha256: *id002
              content:
                type: string
                maxLength: 65536
            required:
            - path
            - base_sha256
            - content
          maxItems: 40
      required:
      - root
      - plan_id
      - part_id
      - changes
  - name: dev-assistant.refactor_review
    description: Inspect proposed before/after contents and get the exact review fingerprint
    input_schema:
      type: object
      additionalProperties: false
      properties:
        root: *id001
        plan_id: *id002
      required:
      - root
      - plan_id
  - name: dev-assistant.refactor_apply
    description: Review fingerprint and host confirmation required; preserve conflicting
      external edits
    input_schema:
      type: object
      additionalProperties: false
      properties:
        root: *id001
        plan_id: *id002
        review_sha256: *id002
      required:
      - root
      - plan_id
      - review_sha256
  - name: dev-assistant.refactor_undo
    description: Review fingerprint and host confirmation required; preserve conflicting
      external edits
    input_schema:
      type: object
      additionalProperties: false
      properties:
        root: *id001
        plan_id: *id002
        review_sha256: *id002
      required:
      - root
      - plan_id
      - review_sha256
  - name: dev-assistant.inspect
    description: Build a bounded durable source file map with ignore and credential
      filtering; requires exact workspace read grant
    input_schema:
      type: object
      additionalProperties: false
      properties:
        root:
          type: string
        max_files:
          type: integer
          minimum: 1
          maximum: 10000
        max_bytes:
          type: integer
          minimum: 1
          maximum: 67108864
        page_entries:
          type: integer
          minimum: 1
          maximum: 5000
      required:
      - root
  - name: dev-assistant.inventory
    description: Read the cached source map; freshness is explicitly not rechecked
    input_schema:
      type: object
      additionalProperties: false
      properties:
        root:
          type: string
      required:
      - root
  - name: dev-assistant.read_safe
    description: Read an existing UTF-8 source file through the ignore and credential
      policy; maximum 64 KiB
    input_schema:
      type: object
      additionalProperties: false
      properties:
        root:
          type: string
        path:
          type: string
      required:
      - root
      - path
  - name: dev-assistant.inspect_continue
    description: Continue the latest saved inspection for this workspace; rechecks read grants and preserves total budgets
    input_schema:
      type: object
      additionalProperties: false
      properties:
        root:
          type: string
      required:
      - root

ui:
  entry: ui/index.html
  mode: declarative_ui
  contract: 2
min_os_api: 5
