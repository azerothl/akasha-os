name: dev-assistant
version: 0.2.0
hash: "ci"
permissions:
  # Host `/host/<id>/**` caps are granted after workspace.bind + cap review
  # (fail-closed). Bind itself only needs a user-confirmed absolute path.
  required_caps: []
tools:
  - name: dev-assistant.bind
    description: Bind an absolute host folder as /host/<id> (returns caps to review)
    input_schema:
      type: object
      properties:
        host_path: { type: string, description: Absolute host directory }
      required: [host_path]
  - name: dev-assistant.list
    description: List bound host workspaces for this actor
    input_schema:
      type: object
  - name: dev-assistant.search
    description: Bounded text search under a bound workspace (requires fs.read:/host/<id>/**)
    input_schema:
      type: object
      properties:
        root: { type: string, description: workspace_id or /host/<id> path }
        query: { type: string }
        glob: { type: string }
        limit: { type: integer }
      required: [root, query]
  - name: dev-assistant.apply_patch
    description: Replace file contents under /host/<id> (requires fs.write; prefer over fs.write)
    input_schema:
      type: object
      properties:
        path: { type: string, description: Logical /host/<id>/… path }
        content: { type: string, description: Full replacement body (replace_all) }
      required: [path, content]
  - name: dev-assistant.undo_patch
    description: Undo a previous apply_patch group
    input_schema:
      type: object
      properties:
        undo_group_id: { type: string }
      required: [undo_group_id]
  - name: dev-assistant.git_status
    description: Read-only git status for a bound workspace (requires fs.read:/host/<id>/**)
    input_schema:
      type: object
      properties:
        root: { type: string, description: workspace_id or /host/<id> path }
      required: [root]
  - name: dev-assistant.git_diff
    description: Read-only unified git diff (worktree or staged) under a bound workspace
    input_schema:
      type: object
      properties:
        root: { type: string, description: workspace_id or /host/<id> path }
        path: { type: string, description: optional /host/<id>/… or repo-relative path }
        staged: { type: boolean, description: when true, show staged (--cached) diff }
      required: [root]
  - name: dev-assistant.run
    description: Run a fixed allowlisted workspace task after explicit capabilities and host confirmation
    input_schema:
      type: object
      properties:
        root: { type: string }
        task: { type: string }
      required: [root, task]
  - name: dev-assistant.git_commit
    description: Commit staged changes only, after explicit capabilities and host confirmation; no hooks or signing
    input_schema:
      type: object
      properties:
        root: { type: string }
        message: { type: string }
      required: [root, message]
  - name: dev-assistant.studio_project
    description: Inspect the mapped local Code Studio project and its persistent code index
    input_schema:
      type: object
      properties:
        root: { type: string }
      required: [root]
  - name: dev-assistant.studio_reindex
    description: Incrementally refresh the mapped Code Studio index after host confirmation
    input_schema:
      type: object
      properties:
        root: { type: string }
      required: [root]
  - name: dev-assistant.studio_lsp
    description: Query diagnostics, definition or references through Code Studio after host confirmation
    input_schema:
      type: object
      properties:
        root: { type: string }
        action: { type: string, enum: [diagnostics, definition, references] }
        path: { type: string }
        text: { type: string }
        position:
          type: object
          properties:
            line: { type: integer, minimum: 0 }
            character: { type: integer, minimum: 0 }
      required: [root, action, path]
ui:
  entry: ui/index.html
  mode: declarative_ui
  contract: 2
min_os_api: 2
