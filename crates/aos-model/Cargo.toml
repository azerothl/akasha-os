[package]
name = "aos-model"
description = "Akasha OS — Model Subsystem v1 : daemon aos-modeld (P1.1, P1.2, P1.3)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aos-ipc = { path = "../aos-ipc" }
aos-llama = { path = "../aos-llama", default-features = false }
aos-placement = { path = "../aos-placement" }
aos-proto = { path = "../aos-proto" }
aos-registry = { path = "../aos-registry" }
serde.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures.workspace = true
sysinfo = "0.33"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde_json.workspace = true

[features]
default = ["cuda"]
cuda = ["aos-llama/cuda"]

[lib]
name = "aos_model"
path = "src/lib.rs"

[[bin]]
name = "aos-modeld"
path = "src/bin/aos-modeld.rs"

[[bin]]
name = "aos-gate-p5"
path = "src/bin/aos-gate-p5.rs"
