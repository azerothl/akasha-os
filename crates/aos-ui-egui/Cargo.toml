[package]
name = "aos-ui-egui"
description = "Prototype GUI egui (ADR 0003) — chat + dashboard + agents via le bus"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
winres = "0.1"

[dependencies]
aos-ipc = { path = "../aos-ipc" }
aos-proto = { path = "../aos-proto" }
aos-agent = { path = "../aos-agent" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
eframe = "0.31"
egui_commonmark = { version = "0.20", default-features = false, features = ["pulldown_cmark"] }
