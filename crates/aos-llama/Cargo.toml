[package]
name = "aos-llama"
description = "Akasha OS — Backend Manager llama.cpp via FFI (P1.1)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
llama-cpp-sys-2 = { version = "0.1.154", default-features = false }
hf-chat-template = { version = "1.0", default-features = true }
serde_json.workspace = true
thiserror.workspace = true
serde.workspace = true

[features]
default = ["cuda", "mtmd"]
cuda = ["llama-cpp-sys-2/cuda"]
metal = ["llama-cpp-sys-2/metal"]
mtmd = ["llama-cpp-sys-2/mtmd"]
