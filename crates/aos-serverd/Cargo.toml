[package]
name = "aos-serverd"
description = "Akasha OS Preview — server lifecycle daemon (P21 / aos-serverd)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "aos_serverd"
path = "src/lib.rs"

[[bin]]
name = "aos-serverd"
path = "src/main.rs"

[dependencies]
aos-ipc = { path = "../aos-ipc" }
ctrlc = "3"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
