[package]
name = "aos-platform"
description = "Akasha OS — plateforme P2 : audit, storage, memory, module runtime WASM"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aos-agent = { path = "../aos-agent" }
aos-caps = { path = "../aos-caps" }
aos-ipc = { path = "../aos-ipc" }
aos-llama = { path = "../aos-llama", optional = true, default-features = false }
aos-proto = { path = "../aos-proto" }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures.workspace = true
wasmtime = "47"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
url = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
printpdf = "0.7"
chacha20poly1305 = "0.10"
rand = "0.8"
keyring = "3"
ed25519-dalek = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[features]
default = ["embeddings", "cuda"]
# Pulls llama.cpp. Disable `cuda` for CPU-only packaging.
embeddings = ["dep:aos-llama"]
cuda = ["aos-llama?/cuda"]

[dev-dependencies]
wat = "1"

[lib]
name = "aos_platform"
path = "src/lib.rs"

[[bin]]
name = "aos-platformd"
path = "src/bin/aos-platformd.rs"

[[bin]]
name = "aos-gate-p2"
path = "src/bin/aos-gate-p2.rs"

[[bin]]
name = "aos-gate-p3"
path = "src/bin/aos-gate-p3.rs"

[[bin]]
name = "aos-gate-ext"
path = "src/bin/aos-gate-ext.rs"
