name: illustration-studio
version: 0.7.15
hash: 1ea7b9fa2f840ff368d5cf205076a8b51a4eb35c4c2f2e0e62d952b77b5de959
permissions:
  required_caps:
    - fs.read:/documents/illustrations/**
    - fs.write:/documents/illustrations/**
    - render.stub
    - render.cpu
    - render.blender
    - illustration.dependencies.install
    - illustration.asset.import
    - asset.read:/assets/illustration/**
    - scene.compose
    - scene.pose
    - scene.edit
    - scene.lock
    - mesh.neural
    - comic.layout
    - comic.render
    - storyboard.edit
    - tool.invoke:illustration-studio
tools:
  - name: illustration.project.load
    description: Load SceneGraph project YAML
    input_schema:
      type: object
  - name: illustration.project.save
    description: Persist SceneGraph project YAML
    input_schema:
      type: object
      properties:
        yaml:
          type: string
      required: [yaml]
  - name: illustration.project.ensure
    description: Ensure demo project YAML exists
    input_schema:
      type: object
  - name: illustration.document.load
    description: Load package UI state
    input_schema:
      type: object
  - name: illustration.document.save
    description: Persist package UI state
    input_schema:
      type: object
  - name: scene.get
    description: Read SceneGraph snapshot (yaml + selection + locks)
    input_schema:
      type: object
      properties:
        scene_yaml:
          type: string
  - name: scene.select
    description: Select a SceneGraph node
    input_schema:
      type: object
      properties:
        id:
          type: string
        scene_yaml:
          type: string
      required: [id]
  - name: scene.trs
    description: Set node translation/rotation/scale (ADR 0011)
    input_schema:
      type: object
      properties:
        id:
          type: string
        translation:
          type: object
        rotation:
          type: object
        scale:
          type: object
        scene_yaml:
          type: string
      required: [id]
  - name: scene.camera
    description: Set active camera eye/look-at/orbit/FOV (ADR 0011)
    input_schema:
      type: object
      properties:
        id:
          type: string
        eye:
          type: object
        look_at:
          type: object
        fov_deg:
          type: number
        yaw:
          type: number
        pitch:
          type: number
        distance:
          type: number
        scene_yaml:
          type: string
  - name: scene.light
    description: Add or edit SceneGraph Light nodes (type/intensity/color)
    input_schema:
      type: object
      properties:
        id:
          type: string
        add:
          type: boolean
        parent_id:
          type: string
        light_type:
          type: string
        intensity:
          type: number
        color_srgb:
          type: array
        color_r:
          type: number
        color_g:
          type: number
        color_b:
          type: number
        scene_yaml:
          type: string
  - name: scene.apply
    description: Transactional agent edit batch (apply or rollback)
    input_schema:
      type: object
      properties:
        ops:
          type: array
        scene_yaml:
          type: string
      required: [ops]
  - name: scene.lock
    description: Semantic lock a node or subtree (agent must not mutate)
    input_schema:
      type: object
      properties:
        id:
          type: string
        scope:
          type: string
        kind:
          type: string
        scene_yaml:
          type: string
      required: [id]
  - name: scene.unlock
    description: Clear a semantic lock
    input_schema:
      type: object
      properties:
        id:
          type: string
        scene_yaml:
          type: string
      required: [id]
  - name: scene.locks
    description: List semantic locks
    input_schema:
      type: object
      properties:
        scene_yaml:
          type: string
  - name: scene.compose
    description: Compose SceneGraph from a short prompt
    input_schema:
      type: object
      properties:
        prompt:
          type: string
      required: [prompt]
  - name: scene.pose
    description: Apply pose/IK-lite to a humanoid
    input_schema:
      type: object
      properties:
        humanoid_root:
          type: string
        preset:
          type: string
        scene_yaml:
          type: string
  - name: scene.instantiate
    description: Instantiate an illustration asset into the SceneGraph
    input_schema:
      type: object
      properties:
        asset_id:
          type: string
        parent_id:
          type: string
        prefix:
          type: string
        scene_yaml:
          type: string
      required: [asset_id]
ui:
  contract: 2
  document: ui/index.json
  entry: ui/index.json
  mode: declarative_ui
min_os_api: 1
