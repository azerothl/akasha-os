name: canvas
version: 1.0.0
hash: 957f12bbe0b021d9e0b18bc54e2a471b7b0220a306c9afcc21a697e6944dbd46
permissions:
  required_caps:
    - fs.write:/downloads/**
tools:
  - name: canvas.set_style
    description: Set session pen color (#RRGGBB) and optional width; subsequent ops inherit when color/width omitted
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        color: { type: string }
        width: { type: number }
      required: [session_id]
  - name: canvas.stroke
    description: Draw a polyline stroke (normalized 0..1 points) on the chat session canvas
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        points: { type: array, items: { type: object, properties: { x: { type: number }, y: { type: number } } } }
        color: { type: string }
        width: { type: number }
      required: [session_id, points]
  - name: canvas.line
    description: Draw a straight line segment (2 points) on the session canvas
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        p0: { type: object, properties: { x: { type: number }, y: { type: number } } }
        p1: { type: object, properties: { x: { type: number }, y: { type: number } } }
        color: { type: string }
        width: { type: number }
      required: [session_id, p0, p1]
  - name: canvas.spline
    description: Draw a smooth spline through control points on the session canvas
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        points: { type: array, items: { type: object, properties: { x: { type: number }, y: { type: number } } } }
        color: { type: string }
        width: { type: number }
      required: [session_id, points]
  - name: canvas.path
    description: Draw a smooth filled silhouette (closed path) through control points — prefer for hills, bodies, sails
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        points: { type: array, items: { type: object, properties: { x: { type: number }, y: { type: number } } } }
        color: { type: string }
        width: { type: number }
        fill: { type: boolean }
        closed: { type: boolean }
      required: [session_id, points]
  - name: canvas.rect
    description: Draw a rectangle on the session canvas
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        x: { type: number }
        y: { type: number }
        w: { type: number }
        h: { type: number }
        color: { type: string }
        fill: { type: boolean }
        width: { type: number }
      required: [session_id, x, y, w, h]
  - name: canvas.ellipse
    description: Draw an ellipse on the session canvas
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        x: { type: number }
        y: { type: number }
        w: { type: number }
        h: { type: number }
        color: { type: string }
        fill: { type: boolean }
        width: { type: number }
      required: [session_id, x, y, w, h]
  - name: canvas.fill
    description: Flood-fill at a point on the session canvas
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        x: { type: number }
        y: { type: number }
        color: { type: string }
      required: [session_id, x, y]
  - name: canvas.erase
    description: Erase along a polyline (paints background)
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        points: { type: array }
        width: { type: number }
      required: [session_id, points]
  - name: canvas.clear
    description: Clear the session canvas
    input_schema:
      type: object
      properties:
        session_id: { type: string }
      required: [session_id]
  - name: canvas.undo
    description: Undo the last canvas operation
    input_schema:
      type: object
      properties:
        session_id: { type: string }
      required: [session_id]
  - name: canvas.get
    description: Read canvas ops (optional after_seq for deltas)
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        after_seq: { type: integer }
      required: [session_id]
  - name: canvas.export
    description: Export canvas as PNG, SVG, or JSON under /downloads
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        path: { type: string }
        width: { type: integer }
        height: { type: integer }
        format: { type: string }
      required: [session_id]
  - name: canvas.delete
    description: Delete the canvas object identified by seq
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        seq: { type: integer }
      required: [session_id, seq]
  - name: canvas.move
    description: Move the canvas object seq by dx,dy in normalized 0..1 space
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        seq: { type: integer }
        dx: { type: number }
        dy: { type: number }
      required: [session_id, seq, dx, dy]
  - name: canvas.reorder
    description: Change z-order of canvas object seq (0 = back)
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        seq: { type: integer }
        z: { type: integer }
      required: [session_id, seq, z]
  - name: canvas.restyle
    description: Change color, width, or fill of canvas object seq
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        seq: { type: integer }
        color: { type: string }
        width: { type: number }
        fill: { type: boolean }
      required: [session_id, seq]
  - name: canvas.layer_create
    description: Create a named canvas layer (optional parent_id for a group)
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        name: { type: string }
        parent_id: { type: string }
      required: [session_id]
  - name: canvas.layer_rename
    description: Rename a canvas layer
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        id: { type: string }
        name: { type: string }
      required: [session_id, id, name]
  - name: canvas.layer_set
    description: Set canvas layer visible, locked, and/or opacity
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        id: { type: string }
        visible: { type: boolean }
        locked: { type: boolean }
        opacity: { type: number }
      required: [session_id, id]
  - name: canvas.layer_reorder
    description: Reorder a canvas layer among siblings
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        id: { type: string }
        parent_id: { type: string }
        z: { type: integer }
      required: [session_id, id, z]
  - name: canvas.layer_delete
    description: Delete a canvas layer (ops reassigned to parent or default)
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        id: { type: string }
      required: [session_id, id]
  - name: canvas.layer_activate
    description: Set the active canvas layer for subsequent drawing
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        id: { type: string }
      required: [session_id, id]
  - name: canvas.align
    description: Align seq to to_seq or the usable 0.10 margin
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        seq: { type: integer }
        to_seq: { type: integer }
        edges: { type: array, items: { type: string } }
      required: [session_id, seq, edges]
  - name: canvas.rotate
    description: Set rect/ellipse rotation in degrees around the bbox centre
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        seq: { type: integer }
        rotation: { type: number }
      required: [session_id, seq, rotation]
min_os_api: 1
