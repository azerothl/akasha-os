name: canvas
version: 1.0.0
hash: 3817c2ed17a53ac110de6007be8e47a0d959bd0bb5b076efa67ab5876e19e32e
permissions:
  required_caps:
    - fs.write:/downloads/**
tools:
  - name: canvas.set_style
    description: Set session pen color (#RRGGBB) and optional width; subsequent ops inherit when color/width omitted
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        color: { type: string }
        width: { type: number }
      required: [session_id]
  - name: canvas.stroke
    description: Draw a polyline stroke (normalized 0..1 points) on the chat session canvas
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        points: { type: array, items: { type: object, properties: { x: { type: number }, y: { type: number } } } }
        color: { type: string }
        width: { type: number }
      required: [session_id, points]
  - name: canvas.line
    description: Draw a straight line segment (2 points) on the session canvas
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        p0: { type: object, properties: { x: { type: number }, y: { type: number } } }
        p1: { type: object, properties: { x: { type: number }, y: { type: number } } }
        color: { type: string }
        width: { type: number }
      required: [session_id, p0, p1]
  - name: canvas.spline
    description: Draw a smooth spline through control points on the session canvas
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        points: { type: array, items: { type: object, properties: { x: { type: number }, y: { type: number } } } }
        color: { type: string }
        width: { type: number }
      required: [session_id, points]
  - name: canvas.rect
    description: Draw a rectangle on the session canvas
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        x: { type: number }
        y: { type: number }
        w: { type: number }
        h: { type: number }
        color: { type: string }
        fill: { type: boolean }
        width: { type: number }
      required: [session_id, x, y, w, h]
  - name: canvas.ellipse
    description: Draw an ellipse on the session canvas
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        x: { type: number }
        y: { type: number }
        w: { type: number }
        h: { type: number }
        color: { type: string }
        fill: { type: boolean }
        width: { type: number }
      required: [session_id, x, y, w, h]
  - name: canvas.fill
    description: Flood-fill at a point on the session canvas
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        x: { type: number }
        y: { type: number }
        color: { type: string }
      required: [session_id, x, y]
  - name: canvas.erase
    description: Erase along a polyline (paints background)
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        points: { type: array }
        width: { type: number }
      required: [session_id, points]
  - name: canvas.clear
    description: Clear the session canvas
    input_schema:
      type: object
      properties:
        session_id: { type: string }
      required: [session_id]
  - name: canvas.undo
    description: Undo the last canvas operation
    input_schema:
      type: object
      properties:
        session_id: { type: string }
      required: [session_id]
  - name: canvas.get
    description: Read canvas ops (optional after_seq for deltas)
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        after_seq: { type: integer }
      required: [session_id]
  - name: canvas.export
    description: Export canvas as PNG under /downloads
    input_schema:
      type: object
      properties:
        session_id: { type: string }
        path: { type: string }
        width: { type: integer }
        height: { type: integer }
      required: [session_id]
min_os_api: 1
