name: notes
version: 1.1.0
hash: 796d1ab2256924939a298c8fab7ca1077618b9064cfdafa42a6389667054dbf5
permissions:
  required_caps:
    - fs.read:/documents/notes/**
    - fs.write:/documents/notes/**
    - mem.write:module:notes
    - mem.query:module:notes
tools:
  - name: notes.create
    description: Create or overwrite a markdown note (file + memory + graph)
    input_schema:
      type: object
      properties:
        title: { type: string }
        content: { type: string }
      required: [title, content]
    output_schema:
      type: object
      properties:
        path: { type: string }
        slug: { type: string }
        version: { type: integer }
        memory_id: { type: integer }
  - name: notes.update
    description: Update an existing note (reindexes memory + graph)
    input_schema:
      type: object
      properties:
        title: { type: string }
        path: { type: string }
        slug: { type: string }
        content: { type: string }
        new_title: { type: string }
      required: [content]
  - name: notes.list
    description: List notes (title, path, excerpt)
    input_schema:
      type: object
    output_schema:
      type: object
      properties:
        notes: { type: array }
  - name: notes.read
    description: Read a note by title, path or slug (includes links)
    input_schema:
      type: object
      properties:
        title: { type: string }
        path: { type: string }
        slug: { type: string }
  - name: notes.search
    description: Semantic search over notes (deduped by path)
    input_schema:
      type: object
      properties:
        query: { type: string }
        k: { type: integer }
      required: [query]
  - name: notes.links
    description: Outgoing links and backlinks for a note
    input_schema:
      type: object
      properties:
        title: { type: string }
        path: { type: string }
        slug: { type: string }
  - name: notes.related
    description: Graph-linked notes scored by semantic relevance to a topic
    input_schema:
      type: object
      properties:
        title: { type: string }
        path: { type: string }
        slug: { type: string }
        topic: { type: string }
        hops: { type: integer }
        k: { type: integer }
ui:
  entry: ui/index.html
  mode: declarative_ui
min_os_api: 1