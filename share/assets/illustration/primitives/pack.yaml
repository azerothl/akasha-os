# Illustration Studio — core primitives asset pack (ADR 0011).
# Logical path: /assets/illustration/primitives/pack.yaml
# Cap: asset.read:/assets/illustration/**
format_version: 1
pack_id: illustration-primitives-v0
conventions: ADR-0011
entries:
  - kind: mesh_box
    id: prop.box
    name: Box
    size: [1.0, 1.0, 1.0]
  - kind: mesh_box
    id: prop.ground
    name: Ground
    size: [6.0, 0.08, 6.0]
  - kind: mesh_box
    id: prop.pedestal
    name: Pedestal
    size: [1.2, 0.35, 1.2]
  - kind: prefab
    id: humanoid.placeholder
    name: Humanoid
    nodes:
      # Root empty at origin; body parts as MeshBox children (metres, Y-up).
      - id: humanoid
        name: Humanoid
        kind: empty
        translation: [0.0, 0.0, 0.0]
        scale: [1.0, 1.0, 1.0]
      - id: torso
        name: Torso
        parent: humanoid
        kind: mesh_box
        translation: [0.0, 1.0, 0.0]
        scale: [0.45, 0.55, 0.25]
      - id: head
        name: Head
        parent: humanoid
        kind: mesh_box
        translation: [0.0, 1.55, 0.0]
        scale: [0.22, 0.22, 0.22]
      - id: leg_l
        name: LegL
        parent: humanoid
        kind: mesh_box
        translation: [-0.12, 0.35, 0.0]
        scale: [0.14, 0.7, 0.14]
      - id: leg_r
        name: LegR
        parent: humanoid
        kind: mesh_box
        translation: [0.12, 0.35, 0.0]
        scale: [0.14, 0.7, 0.14]
      - id: arm_l
        name: ArmL
        parent: humanoid
        kind: mesh_box
        translation: [-0.38, 1.05, 0.0]
        scale: [0.12, 0.5, 0.12]
      - id: arm_r
        name: ArmR
        parent: humanoid
        kind: mesh_box
        translation: [0.38, 1.05, 0.0]
        scale: [0.12, 0.5, 0.12]
  - kind: prefab
    id: scene.starter
    name: Starter set
    nodes:
      # Compact blockout: ground + pedestal + box (humanoid added separately in demo).
      - id: set
        name: Starter set
        kind: empty
        translation: [0.0, 0.0, 0.0]
        scale: [1.0, 1.0, 1.0]
      - id: ground
        name: Ground
        parent: set
        kind: mesh_box
        translation: [0.0, 0.04, 0.0]
        scale: [6.0, 0.08, 6.0]
      - id: pedestal
        name: Pedestal
        parent: set
        kind: mesh_box
        translation: [0.0, 0.175, 0.0]
        scale: [1.2, 0.35, 1.2]
      - id: box
        name: Box
        parent: set
        kind: mesh_box
        translation: [0.0, 0.675, 0.0]
        scale: [0.7, 0.7, 0.7]
