# NPR style: Ink / encre (spec §35 ink_clean).
id: ink
family: ink
renderer: npr
line:
  type: ink
  width: 1.8
  jitter: 0.05
  opacity: 1.0
  width_min: 0.5
  width_max: 3.0
shading:
  type: hatch
  contrast: 0.55
color:
  saturation: 0
paper:
  texture: smooth
  tint: [255, 255, 252]
pressure_variation: 0.4
aliases:
  - ink_clean
  - encre
