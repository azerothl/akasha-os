[workspace]
resolver = "2"
members = [
    "crates/aos-caps",
    "crates/aos-placement",
    "crates/aos-registry",
    "crates/aos-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
bitflags = { version = "2", features = ["serde"] }
thiserror = "2"
