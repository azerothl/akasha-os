[workspace]
resolver = "2"
members = ["crates/aos-agent", "crates/aos-auditd", "crates/aos-capkd",
    "crates/aos-caps", "crates/aos-ipc", "crates/aos-llama", "crates/aos-model",
    "crates/aos-placement", "crates/aos-platform", "crates/aos-proto",
    "crates/aos-registry", "crates/aos-sel4-abi", "crates/aos-sel4-capkd",
    "crates/aos-session", "crates/aos-sim", "crates/aos-ui", "crates/aos-ui-egui",
    "crates/aos-ui-iced",
]
exclude = [
    # Modules WASM (cible wasm32-unknown-unknown, workspaces propres —
    # ne jamais lier `host_call` côté hôte).
    "modules/notes",
    "modules/tasks",
    "modules/ext-rt",
    "modules/sdk",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
bitflags = { version = "2", features = ["serde"] }
thiserror = { version = "2", default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
ciborium = "0.2"
futures = "0.3"
serde_json = "1"

# Shrink Preview zips: drop symbols (CUDA fatbins still dominate linked size).
[profile.release]
strip = "symbols"
debug = false
