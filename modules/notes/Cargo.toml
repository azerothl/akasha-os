[package]
name = "module-notes"
description = "Module de référence « notes » (double surface) — WASM guest"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
aos-module-sdk = { path = "../sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
