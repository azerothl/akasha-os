name: illustration-studio
version: 0.7.19
hash: BUILD_HASH
permissions:
  required_caps:
    - fs.read:/documents/illustrations/**
    - fs.write:/documents/illustrations/**
    - render.stub
    - render.cpu
    - render.blender
    - illustration.dependencies.install
    - illustration.asset.import
    - asset.read:/assets/illustration/**
    - scene.compose
    - scene.pose
    - scene.edit
    - scene.lock
    - mesh.neural
    - comic.layout
    - comic.render
    - storyboard.edit
    - tool.invoke:illustration-studio
tools:
  - name: illustration.project.list
    description: List managed projects and the legacy import opportunity
    input_schema:
      type: object
  - name: illustration.project.create
    description: Create a managed Illustration Studio project
    input_schema:
      type: object
      properties:
        title:
          type: string
        yaml:
          type: string
      required: [title]
  - name: illustration.project.open
    description: Open a managed project
    input_schema:
      type: object
      properties:
        project_id:
          type: string
      required: [project_id]
  - name: illustration.project.work_area
    description: Remember the selected project work area
    input_schema:
      type: object
      properties:
        project_id:
          type: string
        work_area:
          type: string
      required: [project_id, work_area]
  - name: illustration.project.import_legacy
    description: Copy the former single project into managed projects
    input_schema:
      type: object
  - name: illustration.project.load
    description: Load a managed SceneGraph project YAML
    input_schema:
      type: object
      properties:
        project_id:
          type: string
      required: [project_id]
  - name: illustration.project.save
    description: Persist SceneGraph project YAML
    input_schema:
      type: object
      properties:
        project_id:
          type: string
        yaml:
          type: string
      required: [project_id, yaml]
  - name: illustration.project.close
    description: Save the current project and return to the project browser
    input_schema:
      type: object
      properties:
        project_id:
          type: string
        yaml:
          type: string
      required: [project_id, yaml]
  - name: illustration.document.load
    description: Load package UI state
    input_schema:
      type: object
      properties:
        project_id:
          type: string
      required: [project_id]
  - name: illustration.document.save
    description: Persist package UI state
    input_schema:
      type: object
  - name: scene.get
    description: Read SceneGraph snapshot (yaml + selection + locks)
    input_schema:
      type: object
      properties:
        scene_yaml:
          type: string
  - name: scene.select
    description: Select a SceneGraph node
    input_schema:
      type: object
      properties:
        id:
          type: string
        scene_yaml:
          type: string
      required: [id]
  - name: scene.trs
    description: Set node translation/rotation/scale (ADR 0011)
    input_schema:
      type: object
      properties:
        id:
          type: string
        translation:
          type: object
        rotation:
          type: object
        scale:
          type: object
        scene_yaml:
          type: string
      required: [id]
  - name: scene.camera
    description: Set active camera eye/look-at/orbit/FOV (ADR 0011)
    input_schema:
      type: object
      properties:
        id:
          type: string
        eye:
          type: object
        look_at:
          type: object
        fov_deg:
          type: number
        yaw:
          type: number
        pitch:
          type: number
        distance:
          type: number
        scene_yaml:
          type: string
  - name: scene.light
    description: Add or edit SceneGraph Light nodes (type/intensity/color)
    input_schema:
      type: object
      properties:
        id:
          type: string
        add:
          type: boolean
        parent_id:
          type: string
        light_type:
          type: string
        intensity:
          type: number
        color_srgb:
          type: array
        color_r:
          type: number
        color_g:
          type: number
        color_b:
          type: number
        scene_yaml:
          type: string
  - name: scene.apply
    description: Transactional agent edit batch (apply or rollback)
    input_schema:
      type: object
      properties:
        ops:
          type: array
        scene_yaml:
          type: string
      required: [ops]
  - name: scene.lock
    description: Semantic lock a node or subtree (agent must not mutate)
    input_schema:
      type: object
      properties:
        id:
          type: string
        scope:
          type: string
        kind:
          type: string
        scene_yaml:
          type: string
      required: [id]
  - name: scene.unlock
    description: Clear a semantic lock
    input_schema:
      type: object
      properties:
        id:
          type: string
        scene_yaml:
          type: string
      required: [id]
  - name: scene.locks
    description: List semantic locks
    input_schema:
      type: object
      properties:
        scene_yaml:
          type: string
  - name: scene.compose
    description: Compose SceneGraph from a short prompt
    input_schema:
      type: object
      properties:
        prompt:
          type: string
      required: [prompt]
  - name: scene.pose
    description: Apply pose/IK-lite to a humanoid
    input_schema:
      type: object
      properties:
        humanoid_root:
          type: string
        preset:
          type: string
        scene_yaml:
          type: string
  - name: scene.animation
    description: Register rigs, poses, keyframes and play the timeline
    input_schema:
      type: object
      properties:
        op:
          type: string
        root_id:
          type: string
        name:
          type: string
        time_ms:
          type: number
        scene_yaml:
          type: string
      required: [op]
  - name: scene.history
    description: Save and restore scene versions and variants
    input_schema:
      type: object
      properties:
        op:
          type: string
        name:
          type: string
        version_id:
          type: number
        scene_yaml:
          type: string
      required: [op]
  - name: scene.diagnostics
    description: Report scene counts and missing imported assets
    input_schema:
      type: object
      properties:
        scene_yaml:
          type: string
  - name: illustration.export_png
    description: Export the latest illustration PNG via native file picker
    input_schema:
      type: object
      properties:
        source_path:
          type: string
      required: [source_path]
  - name: scene.instantiate
    description: Instantiate an illustration asset into the SceneGraph
    input_schema:
      type: object
      properties:
        asset_id:
          type: string
        parent_id:
          type: string
        prefix:
          type: string
        scene_yaml:
          type: string
      required: [asset_id]
ui:
  contract: 2
  document: ui/index.json
  entry: ui/index.json
  mode: declarative_ui
min_os_api: 1
