[package]
name = "module-illustration-studio"
description = "Illustration Studio — Blender pack opt-in + TRELLIS GGUF / lights / edit Preview stack"
version = "0.7.5"
edition = "2021"
license = "Apache-2.0"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"
name = "module_illustration_studio"

[dependencies]
aos-module-sdk = { path = "../sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
