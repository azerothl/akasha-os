[package]
name = "module-illustration-studio"
description = "Illustration Studio — Blender beauty Auto fail-closed (no silent mock) / pack status"
version = "0.7.23"
edition = "2021"
license = "Apache-2.0"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"
name = "module_illustration_studio"

[dependencies]
aos-scene = { path = "../../crates/aos-scene", default-features = false }
aos-module-sdk = { path = "../sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
