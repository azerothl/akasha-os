[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aos-gate"
version = "0.2.0"
description = "Akasha OS host binding for the akasha-model tool gate (Path A + D)."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
dependencies = [
  # Host + outcomes shipped in v0.2.0 (akasha-model#10).
  "akasha-model @ git+https://github.com/azerothl/akasha-model.git@v0.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aos-gate = "aos_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
